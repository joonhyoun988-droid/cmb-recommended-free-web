name: Deploy CMB Preview

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "rum_web_vitals_client.js"
      - "runtime_observability_client.js"
      - ".github/workflows/cmb-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp styles.css _site/styles.css
          cp app.js _site/app.js
          cp rum_web_vitals_client.js _site/rum_web_vitals_client.js
          cp runtime_observability_client.js _site/runtime_observability_client.js
          printf '{"proofLevel":"preview_operational_candidate","source":"github-pages"}\n' > _site/version.json

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
